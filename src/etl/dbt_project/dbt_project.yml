
name: 'agri_price_dbt'
version: '1.0.0'
config-version: 2

profile: 'agri_price_dbt'

model-paths: ["models"]
analysis-paths: ["analyses"]
test-paths: ["tests"]
seed-paths: ["seeds"]
macro-paths: ["macros"]
snapshot-paths: ["snapshots"]

target-path: "target"  # directory which will store compiled SQL files
clean-targets:         # directories to be removed by 'dbt clean'
  - "target"
  - "dbt_packages"

models:
  agri_price_dbt:
    # Config for all models
    +materialized: view  # Default to view, can override to table/incremental
    staging:
      +materialized: view
    marts:
      +materialized: table
