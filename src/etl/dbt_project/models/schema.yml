
version: 2

models:
  - name: stg_market_prices
    description: "Staged market prices with cast types"
    columns:
      - name: price
        tests:
          - not_null
      - name: region_name
        tests:
          - not_null
      - name: commodity_name
        tests:
          - not_null

  - name: market_summary
    description: "Daily summary of prices by commodity and market"
    columns:
      - name: report_date
        tests:
          - not_null
      - name: avg_price
        tests:
          - not_null
