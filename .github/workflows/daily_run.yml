name: Daily Price Extraction

on:
  schedule:
    - cron: '0 4 * * *'    # 12:00 PHT
    - cron: '30 12 * * *'  # 20:30 PHT
  workflow_dispatch:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  # Never cancel a running scrape; a failed run is reported by GitHub's failure email.
  cancel-in-progress: false

jobs:
  # Pushes and PRs: the full gate before merge.
  quality:
    if: github.event_name == 'push' || github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
    - uses: actions/checkout@v4
    - uses: astral-sh/setup-uv@v6
      with:
        enable-cache: true
    - run: uv sync --locked
    # The same hooks as `git commit`: one list of checks in .pre-commit-config.yaml.
    - run: uv run python -m pre_commit run --all-files --show-diff-on-failure
    - run: uv run python -m pytest -q

  # Schedule and manual runs: scrape only. main already passed the gate, and the
  # site keeps no history, so a lint failure must never cost a day of prices.
  pipeline:
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    # ~360 polite sequential requests take about 8-25 minutes.
    timeout-minutes: 90
    permissions:
      contents: read
    steps:
    - uses: actions/checkout@v4
    - uses: astral-sh/setup-uv@v6
      with:
        enable-cache: true
    - run: uv sync --locked --no-dev
    - name: Scrape, publish raw and clean to R2
      env:
        S3_BUCKET_NAME: ${{ secrets.S3_BUCKET_NAME }}
        S3_ENDPOINT_URL: ${{ secrets.S3_ENDPOINT_URL }}
        AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
        AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
        AWS_DEFAULT_REGION: auto
      run: uv run --no-dev python -m src.etl.pipeline
