name: Daily Price Extraction

on:
  schedule:
    # 02:00 UTC = 10:00 AM PH — Single daily run. Extraction takes 1-2h; multiple schedules risk overlap.
    - cron: '0 2 * * *'

  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  # Do NOT cancel in-progress runs. Extraction takes 1-2h; a new trigger must not kill a running job.
  cancel-in-progress: false

jobs:
  extract-and-transform:
    runs-on: ubuntu-latest
    # 6-hour ceiling. The slowest observed run was ~2h; this provides a safe upper bound.
    timeout-minutes: 360
    permissions:
      contents: write
      id-token: write

    env:
      S3_BUCKET_NAME: ${{ secrets.S3_BUCKET_NAME }}
      AWS_DEFAULT_REGION: ap-southeast-2

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Set up Python 3.12
      uses: actions/setup-python@v5
      with:
        python-version: '3.12'

    - name: Install Dependencies
      run: |
        pip install uv
        uv pip install -e . --system

    - name: Configure AWS Credentials (OIDC)
      uses: aws-actions/configure-aws-credentials@v4
      with:
        role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
        aws-region: ap-southeast-2

    - name: Pre-Flight S3 Connection Test
      run: python scripts/preflight_check.py

    - name: Run dlt Pipeline (Extract)
      run: python -m src.etl.dlt_pipeline.agri_price_pipeline

    - name: Run dbt Build (Transform)
      run: |
        cd src/etl/dbt_project
        dbt deps
        dbt build --profiles-dir .
      env:
        AWS_ACCESS_KEY_ID: ${{ env.AWS_ACCESS_KEY_ID }}
        AWS_SECRET_ACCESS_KEY: ${{ env.AWS_SECRET_ACCESS_KEY }}
        AWS_SESSION_TOKEN: ${{ env.AWS_SESSION_TOKEN }}

    - name: Run Data Contract Validation
      run: python -m src.validation.contract
      env:
        LOG_LEVEL: INFO
        DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
