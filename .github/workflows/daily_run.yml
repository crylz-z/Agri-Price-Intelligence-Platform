name: Daily Price Extraction (Triple Tap)

on:
  schedule:
    # Run 3 times a day (UTC times map to PH times: GMT+8)
    # 02:00 UTC = 10:00 AM PH (Run 1: Early Bird)
    # 06:00 UTC = 02:00 PM PH (Run 2: Lunch Update)
    # 10:00 UTC = 06:00 PM PH (Run 3: Final Close)
    - cron: '0 2 * * *'
    - cron: '0 10 * * *'
  
  # Allow manual trigger from GitHub UI
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  extract-and-transform:
    runs-on: ubuntu-latest
    permissions:
      contents: write  # Critical for committing data back
      id-token: write  # Required for requesting the OIDC JWT Token

    steps:
    # 1. Checkout Code
    - name: Checkout Repository
      uses: actions/checkout@v3

    # 2. Setup Python
    - name: Set up Python 3.12
      uses: actions/setup-python@v4
      with:
        python-version: '3.12'

    # 3. Install Dependencies
    - name: Install Dependencies
      run: |
        pip install uv
        uv pip install -e . --system

    # 4. Configure AWS Credentials (OIDC)
    - name: Configure AWS Credentials
      uses: aws-actions/configure-aws-credentials@v4
      with:
        role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
        aws-region: "ap-southeast-2"

    # 5. Pre-Flight S3 Connection Test
    - name: Pre-Flight S3 Connection Test
      run: python scripts/preflight_check.py
      env:
        S3_BUCKET_NAME: ${{ secrets.S3_BUCKET_NAME }}
        AWS_DEFAULT_REGION: "ap-southeast-2"

    # 6. Run Lakehouse ETL Pipeline (Extract -> Transform -> Audit)
    - name: Run Lakehouse ETL Pipeline
      run: |
        python -m src.etl.extract.extract_data
        python -m src.etl.transform.clean_data
        python -m src.validation.contract
      env:
        LOG_LEVEL: "INFO"
        DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
        # AWS Keys are injected by configure-aws-credentials step
        S3_BUCKET_NAME: ${{ secrets.S3_BUCKET_NAME }}
        AWS_DEFAULT_REGION: "ap-southeast-2"
