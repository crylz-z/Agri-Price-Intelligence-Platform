name: Daily Price Extraction (Triple Tap)

on:
  schedule:
    # Run 3 times a day (UTC times map to PH times: GMT+8)
    # 02:00 UTC = 10:00 AM PH (Run 1: Early Bird)
    # 06:00 UTC = 02:00 PM PH (Run 2: Lunch Update)
    # 10:00 UTC = 06:00 PM PH (Run 3: Final Close)
    - cron: '0 2 * * *'
    - cron: '0 6 * * *'
    - cron: '0 9 * * *'  # 09:00 UTC = 05:00 PM PH (Run 4: PDF Extraction)
    - cron: '0 10 * * *'
  
  # Allow manual trigger from GitHub UI
  workflow_dispatch:

jobs:
  extract-and-transform:
    runs-on: ubuntu-latest
    permissions:
      contents: write  # Critical for committing data back

    steps:
    # 1. Checkout Code
    - name: Checkout Repository
      uses: actions/checkout@v3

    # 2. Setup Python
    - name: Set up Python 3.9
      uses: actions/setup-python@v4
      with:
        python-version: '3.9'

    # 3. Install Dependencies
    - name: Install Dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt

    # 4. Run Pipeline (Extract -> Transform -> Audit)
    - name: Run Extraction Engine
      run: |
        python -m src.etl.extract.extract_data
        python -m src.etl.extract.extract_pdf

    # 5. Commit and Push Data
    - name: Commit and Push Changes
      run: |
        git config --global user.name "github-actions[bot]"
        git config --global user.email "github-actions[bot]@users.noreply.github.com"
        
        # Add all new data files (Raw CSVs and Clean Parquet)
        git add data/
        if [ -f audit_log.txt ]; then git add audit_log.txt; fi
        
        # Commit if there are changes
        git commit -m "Auto-update: $(date +'%Y-%m-%d') Data Refresh" || echo "No changes to commit"
        
        # Push to main branch
        git push origin main
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
