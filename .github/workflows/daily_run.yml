name: Daily PSA Prices

on:
  schedule:
    - cron: '37 17 * * *'  # 01:37 PHT; off the hour, as GitHub delays on-the-hour runs most
  workflow_dispatch:
    inputs:
      build:
        description: Run dbt even if PSA has no new release (e.g. after a model fix)
        type: boolean
        default: false
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  # Never cancel a running pipeline; a failed run is reported by GitHub's failure email.
  cancel-in-progress: false

jobs:
  # Pushes and PRs: the full gate before merge.
  quality:
    if: github.event_name == 'push' || github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
    - uses: actions/checkout@v7
    - uses: astral-sh/setup-uv@v10.4.0
      with:
        enable-cache: true
    - run: uv sync --locked
    # The betterleaks hook builds a Go binary; caching it saves that build on every run.
    - uses: actions/cache@v6
      with:
        path: ~/.cache/pre-commit
        key: pre-commit-${{ hashFiles('.pre-commit-config.yaml') }}
    # The same hooks as `git commit`: one list of checks in .pre-commit-config.yaml.
    - run: uv run python -m pre_commit run --all-files --show-diff-on-failure
    - run: uv run python -m pytest -q
    # Compiles every model and test without touching R2.
    - run: uv run python -m dbt.cli.main parse --project-dir dbt --profiles-dir dbt

  # Schedule and manual runs: ingest, then dbt when PSA released something or a mart
  # is older than the newest snapshot. A quiet run costs 4 PSA GETs and one R2 HEAD
  # (Class B) per table plus 5 for the marts.
  pipeline:
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
    - uses: actions/checkout@v7
    - uses: astral-sh/setup-uv@v10.4.0
      with:
        enable-cache: true
    - run: uv sync --locked --no-dev
    - name: Ingest PSA snapshots to R2, build the mart with dbt
      env:
        S3_BUCKET_NAME: ${{ secrets.S3_BUCKET_NAME }}
        S3_ENDPOINT_URL: ${{ secrets.S3_ENDPOINT_URL }}
        AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
        AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
        AWS_DEFAULT_REGION: auto
      run: uv run --no-dev python -m src.etl.pipeline ${{ inputs.build && '--build' || '' }}
    # The run log keeps only dbt's summary; its full log and results go with the runner.
    - if: failure()
      uses: actions/upload-artifact@v7
      with:
        name: dbt-logs-${{ github.run_id }}
        path: |
          dbt/logs/
          dbt/target/run_results.json
        if-no-files-found: ignore
        retention-days: 30
