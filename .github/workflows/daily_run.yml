name: Daily Price Extraction (Triple Tap)

on:
  schedule:
    # Run 3 times a day (UTC times map to PH times: GMT+8)
    # 02:00 UTC = 10:00 AM PH (Run 1: Early Bird)
    # 06:00 UTC = 02:00 PM PH (Run 2: Lunch Update)
    # 10:00 UTC = 06:00 PM PH (Run 3: Final Close)
    - cron: '0 2 * * *'
    - cron: '0 10 * * *'
  
  # Allow manual trigger from GitHub UI
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  extract-and-transform:
    runs-on: ubuntu-latest
    permissions:
      contents: write  # Critical for committing data back

    steps:
    # 1. Checkout Code
    - name: Checkout Repository
      uses: actions/checkout@v3

    # 2. Setup Python
    - name: Set up Python 3.12
      uses: actions/setup-python@v4
      with:
        python-version: '3.12'

    # 3. Install Dependencies
    - name: Install Dependencies
      run: |
        pip install uv
        uv pip install -e . --system

    # 4. Run Lakehouse ETL Pipeline (Extract -> Transform -> Audit)
    - name: Run Lakehouse ETL Pipeline
      run: |
        python -m src.etl.extract.extract_data
        python -m src.etl.transform.clean_data
      env:
        LOG_LEVEL: "INFO"
        DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
        AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
        AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
        S3_BUCKET_NAME: ${{ secrets.S3_BUCKET_NAME }}
        AWS_DEFAULT_REGION: ${{ vars.AWS_DEFAULT_REGION }}
