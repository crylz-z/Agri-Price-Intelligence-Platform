name: Daily Price Extraction

on:
  schedule:
    # scout 1: 12:00 PM PHT = 04:00 UTC
    - cron: '0 4 * * *'
    # scout 2: 05:00 PM PHT = 09:00 UTC
    - cron: '0 9 * * *'
    # harvester 1: 08:30 PM PHT = 12:30 UTC
    - cron: '30 12 * * *'
    # harvester 2: 11:30 PM PHT = 15:30 UTC
    - cron: '30 15 * * *'

  workflow_dispatch:


concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  # Do NOT cancel in-progress runs. Extraction takes 1-2h; a new trigger must not kill a running job.
  cancel-in-progress: false

jobs:
  extract-and-transform:
    runs-on: ubuntu-latest
    # 6-hour ceiling. The slowest observed run was ~2h; this provides a safe upper bound.
    timeout-minutes: 360
    permissions:
      contents: read
      id-token: write

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Set up Python 3.12
      uses: actions/setup-python@v5
      with:
        python-version: '3.12'
        cache: 'pip'
        cache-dependency-path: 'uv.lock'

    - name: Install Dependencies
      run: |
        pip install uv
        uv pip install -e . --system

    - name: Run Core Unit Tests (Pytest)
      run: uv run pytest tests/ -v

    - name: Configure AWS Credentials (OIDC)
      uses: aws-actions/configure-aws-credentials@v4
      with:
        role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
        aws-region: ap-southeast-2

    - name: Pre-Flight S3 Connection Test
      run: python scripts/preflight_check.py
      env:
        S3_BUCKET_NAME: ${{ secrets.S3_BUCKET_NAME }}
        AWS_DEFAULT_REGION: ${{ vars.AWS_DEFAULT_REGION }}

    - name: Run ELT Lakehouse Pipeline
      # run_pipeline.py enforces WAP order: dlt → dbt deps → dbt build.
      # dbt build runs models then tests; any test failure halts the pipeline
      # and triggers a Discord alert before bad data reaches the Gold layer.
      run: python scripts/run_pipeline.py
      env:
        S3_BUCKET_NAME: ${{ secrets.S3_BUCKET_NAME }}
        AWS_DEFAULT_REGION: ${{ vars.AWS_DEFAULT_REGION }}
        DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
