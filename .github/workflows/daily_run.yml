name: Daily Price Extraction

on:
  schedule:
    # Run at 6:00 AM, 12:00 PM, and 6:00 PM PHT (UTC+8)
    # UTC times: 22:00 (prev day), 04:00, 10:00
    - cron: '0 22,4,10 * * *'
  workflow_dispatch: # Allow manual trigger

jobs:
  scrape_and_commit:
    runs-on: ubuntu-latest
    permissions:
      contents: write # Needed to push data back

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.9'

      - name: Install Dependencies
        run: |
          pip install requests pandas beautifulsoup4

      - name: Run Discovery Service (Catalog Update)
        run: python -m etl.extract.fetch_metadata

      - name: Run Extraction Robot
        run: python -m etl.extract.extract_data

      - name: Run Silver Transformation
        run: python -m etl.transform.clean_data

      - name: Commit and Push Data
        run: |
          git config --global user.name "Agri-Price Bot"
          git config --global user.email "bot@users.noreply.github.com"
          git add data/raw/*.csv data/clean/*.csv data/reference/*.csv
          git commit -m "data: Update prices and clean data for $(date +'%Y-%m-%d')" || exit 0
          git push
