name: Daily Price Extraction

on:
  schedule:
    - cron: '0 4 * * *'    # 12:00 PHT
    - cron: '30 12 * * *'  # 20:30 PHT
  workflow_dispatch:
  # Pushes and PRs run the quality gate only, never the pipeline.
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  # Never cancel a running scrape; a failed run is reported by GitHub's failure email.
  cancel-in-progress: false

jobs:
  pipeline:
    runs-on: ubuntu-latest
    # ~360 polite sequential requests take about 15-25 minutes.
    timeout-minutes: 90
    permissions:
      contents: read

    steps:
    - uses: actions/checkout@v4

    - uses: astral-sh/setup-uv@v6
      with:
        enable-cache: true

    - run: uv sync --locked
    - run: uv run ruff format --check .
    - run: uv run ruff check .
    - run: uv run mypy
    - run: uv run python -m pytest -q

    - name: Scrape, publish raw and clean to R2
      if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
      env:
        S3_BUCKET_NAME: ${{ secrets.S3_BUCKET_NAME }}
        S3_ENDPOINT_URL: ${{ secrets.S3_ENDPOINT_URL }}
        AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
        AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
        AWS_DEFAULT_REGION: auto
      run: uv run python -m src.etl.pipeline
