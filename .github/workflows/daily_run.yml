name: Daily Price Extraction (Adaptive)

on:
  schedule:
    # scout 1: 12:00 PM PHT = 04:00 UTC
    - cron: '0 4 * * *'
    # scout 2: 05:00 PM PHT = 09:00 UTC
    - cron: '0 9 * * *'
    # harvester 1: 08:30 PM PHT = 12:30 UTC
    - cron: '30 12 * * *'
    # harvester 2: 11:30 PM PHT = 15:30 UTC
    - cron: '30 15 * * *'
  
  # Allow manual trigger with mode selection
  workflow_dispatch:
    inputs:
      mode:
        description: 'Execution Mode'
        required: true
        default: 'scout'
        type: choice
        options:
        - scout
        - harvester

jobs:
  extract-and-transform:
    runs-on: ubuntu-latest
    permissions:
      contents: write  # Critical for committing data back

    steps:
    # 1. Checkout Code
    - name: Checkout Repository
      uses: actions/checkout@v3

    # 2. Setup Python
    - name: Set up Python 3.9
      uses: actions/setup-python@v4
      with:
        python-version: '3.9'

    # 3. Install Dependencies
    - name: Install Dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt

    # 4. Run Pipeline (Adaptive Mode)
    - name: Run Extraction Engine
      run: |
        # Determine Mode
        MODE="${{ inputs.mode }}"
        
        if [ -z "$MODE" ]; then
          # Automatic Schedule Logic (UTC)
          HOUR=$(date -u +%H)
          if [ "$HOUR" -ge 12 ]; then
            MODE="harvester"
          else
            MODE="scout"
          fi
          echo "⏰ Scheduled Run detected. Time: $(date -u). Selected Mode: $MODE"
        else
          echo "👤 Manual Run detected. User selected: $MODE"
        fi
        
        # Execute
        python -m src.etl.extract.extract_data --mode $MODE

    # 5. Commit and Push Data
    - name: Commit and Push Changes
      run: |
        git config --global user.name "github-actions[bot]"
        git config --global user.email "github-actions[bot]@users.noreply.github.com"
        
        # Add Data & logs
        git add data/
        if [ -f "logs/audit_log.txt" ]; then git add "logs/audit_log.txt"; fi
        
        # Commit if there are changes
        git commit -m "Auto-update: $(date +'%Y-%m-%d') Data Refresh ($MODE Mode)" || echo "No changes to commit"
        
        # Push to main branch
        git push origin main
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
