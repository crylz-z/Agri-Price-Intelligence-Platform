name: Daily PSA Prices

on:
  schedule:
    - cron: '0 2 * * *'    # 10:00 PHT
  workflow_dispatch:
    inputs:
      build:
        description: Run dbt even if PSA has no new release (e.g. after a model fix)
        type: boolean
        default: false
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  # Never cancel a running pipeline; a failed run is reported by GitHub's failure email.
  cancel-in-progress: false

jobs:
  # Pushes and PRs: the full gate before merge.
  quality:
    if: github.event_name == 'push' || github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
    - uses: actions/checkout@v4
    - uses: astral-sh/setup-uv@v6
      with:
        enable-cache: true
    - run: uv sync --locked
    # The same hooks as `git commit`: one list of checks in .pre-commit-config.yaml.
    - run: uv run python -m pre_commit run --all-files --show-diff-on-failure
    - run: uv run python -m pytest -q
    # Compiles every model and test without touching R2.
    - run: uv run python -m dbt.cli.main parse --project-dir dbt --profiles-dir dbt

  # Schedule and manual runs: ingest, then dbt only when PSA released something.
  # A run with no release costs 1 PSA GET and 11 R2 HEADs (Class B).
  pipeline:
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
    - uses: actions/checkout@v4
    - uses: astral-sh/setup-uv@v6
      with:
        enable-cache: true
    - run: uv sync --locked --no-dev
    - name: Ingest PSA snapshots to R2, build the mart with dbt
      env:
        S3_BUCKET_NAME: ${{ secrets.S3_BUCKET_NAME }}
        S3_ENDPOINT_URL: ${{ secrets.S3_ENDPOINT_URL }}
        AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
        AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
        AWS_DEFAULT_REGION: auto
      run: uv run --no-dev python -m src.etl.pipeline ${{ inputs.build && '--build' || '' }}
