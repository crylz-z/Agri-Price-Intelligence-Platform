name: Daily Price Extraction

on:
  schedule:
    # 02:00 UTC = 10:00 AM PH | 06:00 UTC = 02:00 PM PH | 13:00 UTC = 09:00 PM PH
    - cron: '0 2 * * *'
    - cron: '0 6 * * *'
    - cron: '0 13 * * *'

  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  extract-and-transform:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
      id-token: write

    env:
      S3_BUCKET_NAME: ${{ secrets.S3_BUCKET_NAME }}
      AWS_DEFAULT_REGION: ap-southeast-2

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Set up Python 3.12
      uses: actions/setup-python@v5
      with:
        python-version: '3.12'

    - name: Install Dependencies
      run: |
        pip install uv
        uv pip install -e . --system

    - name: Configure AWS Credentials (OIDC)
      uses: aws-actions/configure-aws-credentials@v4
      with:
        role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
        aws-region: ap-southeast-2

    - name: Pre-Flight S3 Connection Test
      run: python scripts/preflight_check.py

    - name: Run dlt Pipeline (Extract)
      run: python -m src.etl.dlt_pipeline.agri_price_pipeline

    - name: Run dbt Build (Transform)
      run: |
        cd src/etl/dbt_project
        dbt deps
        dbt build --profiles-dir .

    - name: Run Data Contract Validation
      run: python -m src.validation.contract
      env:
        LOG_LEVEL: INFO
        DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
