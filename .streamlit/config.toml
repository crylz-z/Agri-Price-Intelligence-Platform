# Palengke report: warm paper (light) or warm charcoal (dark), ink type, one
# slate-blue accent for "selected". Both modes are defined, so the app follows the
# viewer's system setting and the Settings menu can switch it.
# Red and green mean dearer and cheaper only (.claude/rules/dashboard.md), so
# they never appear as a plain series colour; the diverging palette runs green
# (cheaper) to red (dearer) for maps and the calendar; charts read it through
# range="diverging". Colours fixed in code (src/dashboard/views.py) are mid-tones
# that read on both backgrounds.
[theme]
font = "Inter:https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap"
headingFont = "Inter:https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap"
headingFontWeights = [800, 700, 700, 600, 600, 600]
headingFontSizes = ["2.4rem", "1.6rem", "1.25rem", "1rem", "0.9rem", "0.8rem"]
baseFontSize = 16
metricValueFontSize = "1.9rem"
metricValueFontWeight = 700
baseRadius = "0.75rem"
showWidgetBorder = true

[theme.light]
primaryColor = "#3E5C9A"
backgroundColor = "#FAF7F2"
secondaryBackgroundColor = "#F1ECE4"
textColor = "#24211E"
borderColor = "#E3DBCF"
linkColor = "#3E5C9A"
redColor = "#B83227"
greenColor = "#2E7D4F"
blueColor = "#3E5C9A"
orangeColor = "#C98A00"
dataframeHeaderBackgroundColor = "#F1ECE4"
# Accent, ink, amber first: charts pick these with range="category" so a line
# changes with the theme at once. Red/green are left out on purpose.
chartCategoricalColors = ["#3E5C9A", "#24211E", "#C98A00", "#9C9389", "#6B7F99", "#B9AFA3"]
chartSequentialColors = ["#F4F1EC", "#E3DED6", "#CFC8BE", "#B9B1A6", "#A19A90", "#8A837A", "#736D65", "#5C5751", "#45413D", "#24211E"]
chartDivergingColors = ["#1B5E3A", "#2E7D4F", "#5FA77A", "#9CCBA8", "#DCEBDF", "#F6DAD3", "#EBA08D", "#D9664F", "#B83227", "#7E1C14"]

[theme.light.sidebar]
backgroundColor = "#F1ECE4"
secondaryBackgroundColor = "#E8E1D6"
textColor = "#24211E"
borderColor = "#E3DBCF"
primaryColor = "#3E5C9A"
linkColor = "#3E5C9A"

# Dark: lifted red and green so they keep about 5:1 against the background;
# the primary stays dark enough for white button text (4.5:1).
[theme.dark]
primaryColor = "#5675BA"
backgroundColor = "#171513"
secondaryBackgroundColor = "#221F1C"
textColor = "#EDE7DF"
borderColor = "#3A352F"
linkColor = "#8FAAE0"
redColor = "#E0624F"
greenColor = "#4FAE76"
blueColor = "#7C9AD6"
orangeColor = "#E0A526"
dataframeHeaderBackgroundColor = "#221F1C"
chartCategoricalColors = ["#7C9AD6", "#EDE7DF", "#E0A526", "#8A8178", "#8C9DB5", "#5E5750"]
chartSequentialColors = ["#2A2724", "#3A3632", "#4C4741", "#5F5952", "#736C64", "#888077", "#9E968C", "#B5ADA3", "#CFC8BF", "#EDE7DF"]
# Strongest change = brightest; near zero sinks toward the background.
chartDivergingColors = ["#9BD9B0", "#66C28B", "#3FA36A", "#2B7D50", "#34413A", "#433737", "#9A3A2D", "#C9503E", "#E4735F", "#F4A99A"]

[theme.dark.sidebar]
backgroundColor = "#1E1B18"
secondaryBackgroundColor = "#2A2622"
textColor = "#EDE7DF"
borderColor = "#3A352F"
primaryColor = "#5675BA"
linkColor = "#8FAAE0"
