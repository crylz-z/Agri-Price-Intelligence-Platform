name: apip
version: "0.2.0"
config-version: 2
profile: apip

# Tests sit on the table models, never on the external mart: dbt-duckdb writes an
# external file before its own tests run, so a failing upstream test is what keeps
# bad data off R2 (dbt build skips everything downstream of it).
models:
  apip:
    staging:
      +materialized: table
    intermediate:
      +materialized: table
    marts:
      +materialized: external

seeds:
  apip:
    geolocations:
      +column_types:
        geo_code: varchar
        geolocation: varchar
        geo_level: varchar
        region_code: varchar
    psa_tables:
      +column_types:
        table_id: varchar
        commodity_group: varchar
    psa_farmgate_tables:
      +column_types:
        table_id: varchar
        commodity_group: varchar
    farmgate_commodities:
      +column_types:
        staple: varchar
        table_id: varchar
        farmgate_commodity: varchar
        retail_yield: double
    farmgate_geolocations:
      +column_types:
        label: varchar
        geo_code: varchar
    farmer_share_exclusions:
      +column_types:
        geo_code: varchar
        staple: varchar
        reason: varchar
    psa_farmgate_spot_checks:
      +column_types:
        table_id: varchar
        geo_code: varchar
        commodity: varchar
        month: date
        price: double
    wage_orders:
      +column_types:
        geo_code: varchar
        region: varchar
        wage_order: varchar
        tranche: integer
        effective_date: date
        daily_wage: double
        source_url: varchar
    policy_events:
      +column_types:
        start_date: date
        end_date: date
        staple: varchar
        event: varchar
        source_url: varchar
    staples:
      +column_types:
        staple: varchar
        category: varchar
        unit: varchar
        commodity: varchar
    recipes:
      +column_types:
        dish: varchar
        staple: varchar
        quantity: double
        source: varchar
    psa_spot_checks:
      +column_types:
        geo_code: varchar
        commodity: varchar
        month: date
        price: double
