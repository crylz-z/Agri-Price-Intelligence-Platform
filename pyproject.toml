[project]
name = "agri-price-intelligence-platform"
version = "0.1.0"
description = "Agri-Price Intelligence Platform: Real-time monitoring of agricultural commodity prices."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "requests",
    "urllib3",
    "pandas",
    "fastparquet",
    "streamlit",
    "altair",
    "beautifulsoup4",
    "plotly",
    "folium",
    "streamlit-folium",
    "pyarrow",
    "structlog",
    "pandera",
    "duckdb>=1.4.0",
    "python-dotenv",
    "tenacity",
    "boto3",
    "dbt-core>=1.11.0",
    "dbt-duckdb>=1.9.0",
    "dlt[s3]>=1.22.0",
    "geopy>=2.4.1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src"]

[dependency-groups]
dev = [
  "pre-commit>=4.5.1",
  "pytest",
  "ruff>=0.15.1",
]
