[project]
name = "agri-price-intelligence-platform"
version = "0.1.0"
description = "Agri-Price Intelligence Platform: Real-time monitoring of agricultural commodity prices."
readme = "README.md"
requires-python = ">=3.9"
dependencies = [
    "requests",
    "urllib3",
    "pandas",
    "fastparquet",
    "streamlit",
    "altair",
    "beautifulsoup4",
    "plotly",
    "folium",
    "streamlit-folium",
    "pyarrow",
    "structlog",
    "pandera",
    "duckdb",
    "python-dotenv",
    "tenacity",
    "boto3>=1.42.49",
    "pre-commit",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src"]
