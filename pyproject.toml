[project]
name = "agri-price-intelligence-platform"
version = "0.2.0"
description = "Agri-Price Intelligence Platform: monthly Philippine retail food prices from PSA OpenSTAT, kept at $0."
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "requests",
    "urllib3",
    "pandas",
    "streamlit",
    "altair",
    "pyarrow",
    "structlog",
    "duckdb>=1.4.0",
    "python-dotenv",
    "s3fs",
    "dbt-core>=1.12,<2",
    "dbt-duckdb>=1.11",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src"]

[dependency-groups]
dev = [
  "mypy>=1.13",
  "pandas-stubs~=2.3.0",
  "pre-commit>=4.5.1",
  "pytest",
  "ruff>=0.15.1",
  "types-requests",
]

[tool.ruff]
target-version = "py312"

[tool.ruff.lint]
# DTZ: every "now" and "today" must carry a timezone (Asia/Manila).
extend-select = ["DTZ"]

[tool.mypy]
python_version = "3.12"
strict = true
files = ["src/core", "src/etl", "src/dashboard"]

[[tool.mypy.overrides]]
module = ["pyarrow.*", "s3fs", "fsspec.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
