# Fast checks at commit time (< 3 s). pytest runs in CI before merge.
repos:
  # Local hooks run as `uv run python -m`, like the docs and CI, so ruff and
  # mypy use the uv.lock versions.
  - repo: local
    hooks:
      - id: trailing-whitespace
        name: trim trailing whitespace
        entry: uv run --with pre-commit-hooks==6.0.0 python -m pre_commit_hooks.trailing_whitespace_fixer
        language: system
        types: [text]
      - id: end-of-file-fixer
        name: fix end of files
        entry: uv run --with pre-commit-hooks==6.0.0 python -m pre_commit_hooks.end_of_file_fixer
        language: system
        types: [text]
        exclude: ^tests/fixtures/  # live responses, kept byte for byte
      - id: check-yaml
        name: check yaml
        entry: uv run --with pre-commit-hooks==6.0.0 python -m pre_commit_hooks.check_yaml
        language: system
        types: [yaml]
      - id: ruff-check
        name: ruff check
        entry: uv run python -m ruff check --fix
        language: system
        types_or: [python, pyi]
      - id: ruff-format
        name: ruff format
        entry: uv run python -m ruff format
        language: system
        types_or: [python, pyi]
      - id: mypy
        name: mypy
        entry: uv run python -m mypy
        language: system
        types: [python]
        pass_filenames: false
      - id: dashboard-no-css
        name: dashboard CSS stays in app.py
        entry: <style|unsafe_allow_html|use_container_width
        language: pygrep
        files: ^src/dashboard/.*\.py$
        exclude: ^src/dashboard/app\.py$
  # Secrets in the staged diff. GitHub push protection is the second layer, but it
  # has no pattern for R2's hex S3 keys. pre-commit builds the Go binary into its
  # own cache, so nothing is installed globally.
  - repo: https://github.com/betterleaks/betterleaks
    rev: v1.9.0
    hooks:
      - id: betterleaks
