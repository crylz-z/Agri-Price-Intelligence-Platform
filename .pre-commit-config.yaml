# Fast checks at commit time (< 3 s). pytest runs in CI before merge.
repos:
  # Every hook runs through `python -m`: Smart App Control blocks the unsigned
  # .exe shims in .venv. Ruff and mypy use the uv.lock versions.
  - repo: local
    hooks:
      - id: trailing-whitespace
        name: trim trailing whitespace
        entry: uv run --with pre-commit-hooks==6.0.0 python -m pre_commit_hooks.trailing_whitespace_fixer
        language: system
        types: [text]
      - id: end-of-file-fixer
        name: fix end of files
        entry: uv run --with pre-commit-hooks==6.0.0 python -m pre_commit_hooks.end_of_file_fixer
        language: system
        types: [text]
        exclude: ^tests/fixtures/  # live responses, kept byte for byte
      - id: check-yaml
        name: check yaml
        entry: uv run --with pre-commit-hooks==6.0.0 python -m pre_commit_hooks.check_yaml
        language: system
        types: [yaml]
      - id: ruff-check
        name: ruff check
        entry: uv run python -m ruff check --fix
        language: system
        types_or: [python, pyi]
      - id: ruff-format
        name: ruff format
        entry: uv run python -m ruff format
        language: system
        types_or: [python, pyi]
      - id: mypy
        name: mypy
        entry: uv run python -m mypy
        language: system
        types: [python]
        pass_filenames: false
# Secrets: GitHub secret scanning with push protection, not a local hook.
